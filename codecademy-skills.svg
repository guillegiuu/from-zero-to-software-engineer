<g class="skill"><title>Python: 2.182 XP</title><text class="name" x="24" y="137">Python</text><text class="xp" x="595" y="137" text-anchor="end">2,182 XP</text><rect class="track" x="24" y="146" width="572" height="9" rx="4.5"/><rect class="bar" x="24" y="146" width="312" height="9" rx="4.5"/></g>
<g class="skill"><title>Data Science: 1.731 XP</title><text class="name" x="24" y="180">Data Science</text><text class="xp" x="595" y="180" text-anchor="end">1,731 XP</text><rect class="track" x="24" y="189" width="572" height="9" rx="4.5"/><rect class="bar" x="24" y="189" width="247" height="9" rx="4.5"/></g>
<g class="skill"><title>SQL: 937 XP</title><text class="name" x="24" y="223">SQL</text><text class="xp" x="595" y="223" text-anchor="end">937 XP</text><rect class="track" x="24" y="232" width="572" height="9" rx="4.5"/><rect class="bar" x="24" y="232" width="134" height="9" rx="4.5"/></g>
