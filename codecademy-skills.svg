<svg xmlns="http://www.w3.org/2000/svg" width="620" height="252" viewBox="0 0 620 252" role="img" aria-labelledby="title desc">
<title id="title">Codecademy Skills Tracking</title>
<desc id="desc">Computer Science 3659 XP, Python 2182 XP, Data Science 1731 XP, SQL 937 XP.</desc>
<style>
  .name{font:600 14px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#e6edf3}
  .xp{font:500 13px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#9da7b3}
  .heading{font:700 18px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#f0f6fc}
  .sub{font:12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#8b949e}
  .track{fill:#30363d}
  .bar{fill:#e3b341;transform-box:fill-box;transform-origin:left center;animation:grow 1.3s cubic-bezier(.2,.7,.2,1) both}
  .skill:hover .bar{fill:#ffd866}
  .skill:hover .name{fill:#ffd866}
  .skill:nth-of-type(2) .bar{animation-delay:.1s}
  .skill:nth-of-type(3) .bar{animation-delay:.2s}
  .skill:nth-of-type(4) .bar{animation-delay:.3s}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @media (prefers-reduced-motion:reduce){.bar{animation:none}}
</style>
<rect x="1" y="1" width="618" height="250" rx="12" fill="#0d1117" stroke="#30363d"/>
